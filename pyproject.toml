[project]
name = "21zhishiku"
version = "1.0.0"
description = "21点知识库 - 规则、策略、算牌系统、开源项目索引"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
]

[project.scripts]
kb-server = "api.server:main"
pull-data = "scrape.pull_basics:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
